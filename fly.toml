app = "vanguard"
primary_region = "sin"
swap_size_mb = 256

[build]
  dockerfile = "Dockerfile"

[env]
  TS_HOSTNAME = "pihole-fly"

[[mounts]]
  source = "pihole_data"
  destination = "/etc/pihole"

# Public DNS over TLS (port 853) -> decrypted DNS-over-TCP to Pi-hole (port 53)
[[services]]
  protocol = "tcp"
  internal_port = 53
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 853
    handlers = ["tls"]
    tls_options = { alpn = ["dot"] }

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 500
