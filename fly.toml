app = "vanguard"
primary_region = "sin"
swap_size_mb = 256

[build]
  dockerfile = "Dockerfile"

[env]
  TS_HOSTNAME = "pihole-fly"

[[mounts]]
  source = "pihole_data"
  destination = "/etc/pihole"

# DNS-over-TLS is terminated by Traefik inside the app.
[[services]]
  protocol = "tcp"
  internal_port = 853
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 853

[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
