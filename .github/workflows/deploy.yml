name: Deploy to Fly.io

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure an unattached persistent volume exists
        run: |
          volumes="$(flyctl volumes list --config fly.toml --json)"
          exists="$(jq '
            any(.[]; .name == "pihole_data"
              and .region == "sin"
              and (.attached_machine_id == null or .attached_machine_id == "")
              and (.attached_alloc_id == null or .attached_alloc_id == ""))
          ' <<< "$volumes")"
          if [ "$exists" = "false" ]; then
            flyctl volumes create pihole_data --config fly.toml --region sin --size 1 --yes
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
